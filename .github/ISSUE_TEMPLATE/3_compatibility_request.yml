name: SQL Server Compatibility
description: Report a problem or confirm support for a specific SQL Server version
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        SqlProfiler is expected to work with SQL Server 2005 and later (LocalDB, Express, Developer and full editions).
        Use this form if it does not work with your server or if you have verified a version that is not listed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I have checked that there are no similar open or resolved issues.
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: App version is shown in the main window title.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11 21H2 build 22000
    validations:
      required: true
  - type: input
    id: sql-version
    attributes:
      label: SQL Server version and edition
      description: Result of `SELECT @@VERSION`.
      placeholder: e.g. Microsoft SQL Server 2019 (RTM) Express Edition (64-bit)
    validations:
      required: true
  - type: dropdown
    id: authentication
    attributes:
      label: Authentication
      options:
        - Windows authentication
        - SQL Server authentication
    validations:
      required: true
  - type: textarea
    id: what-was-test
    attributes:
      label: Which features of the application did you test?
      placeholder: e.g. Start/Stop/Pause trace, SQL:BatchCompleted and RPC:Completed events, filters.
    validations:
      required: true
  - type: textarea
    id: what-is-broken
    attributes:
      label: Which features do not work as expected?
      description: Write "everything works" if there are no problems.
      placeholder: e.g. Trace fails to start with an error.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message / screenshots
      description: Paste the error text or drag and drop screenshots here (hide private data).
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Any other relevant information.
