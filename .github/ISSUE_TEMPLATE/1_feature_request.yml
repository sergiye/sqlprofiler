name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement!
        For usage questions please use [Discussions](https://github.com/sergiye/sqlprofiler/discussions) instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I have checked that there are no similar open or resolved issues.
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: App version is shown in the main window title.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: What are you trying to achieve and what gets in the way?
      placeholder: e.g. I need to see only events of a specific application, but the filter works on Text data only.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like the problem to be solved?
      description: Describe what you would like to happen.
      placeholder: e.g. Add a context menu item "Filter by this Application name".
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Screenshots, mockups or any other relevant information.
